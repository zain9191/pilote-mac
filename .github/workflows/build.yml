name: Compilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Générer le projet Xcode
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Tests du code partagé (macOS)
        run: |
          # Journal complet dans un fichier, résumé affiché : on doit voir
          # combien de tests ont tourné, pas seulement que l'étape a réussi.
          status=0
          xcodebuild test -project PiloteMac.xcodeproj -scheme PiloteTests \
            -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY=- > test.log 2>&1 || status=$?
          grep -E "Test Suite 'All tests'|Executed [0-9]+ test|error:|failed" test.log || true
          if [ "$status" -ne 0 ]; then tail -n 60 test.log; fi
          exit "$status"

      - name: Agent macOS
        run: |
          xcodebuild build -project PiloteMac.xcodeproj -scheme PiloteAgent \
            -destination 'generic/platform=macOS' CODE_SIGN_IDENTITY=- -quiet

      - name: App iOS
        run: |
          xcodebuild build -project PiloteMac.xcodeproj -scheme Pilote \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet
