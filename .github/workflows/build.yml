name: Compilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # DEVELOPMENT_TEAM= : le runner n'a pas le compte Apple de project.yml,
      # on compile comme avant qu'il y soit inscrit.
      - name: Générer le projet Xcode
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Tests du code partagé (macOS)
        run: |
          # Journal complet dans un fichier, résumé affiché : on doit voir
          # combien de tests ont tourné, pas seulement que l'étape a réussi.
          status=0
          xcodebuild test -project PiloteMac.xcodeproj -scheme PiloteTests \
            -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= > test.log 2>&1 || status=$?
          grep -E "Test Suite 'All tests'|Executed [0-9]+ test|error:|failed" test.log || true
          if [ "$status" -ne 0 ]; then tail -n 60 test.log; fi
          exit "$status"

      - name: Agent macOS
        run: |
          xcodebuild build -project PiloteMac.xcodeproj -scheme PiloteAgent \
            -destination 'generic/platform=macOS' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -quiet

      # Release (WMO, -O) n'était compilé nulle part : il a échoué sur le Mac de
      # l'utilisateur alors que Debug passait.
      - name: Agent macOS (Release)
        run: |
          status=0
          xcodebuild build -project PiloteMac.xcodeproj -scheme PiloteAgent -configuration Release \
            -destination 'generic/platform=macOS' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= > release.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then grep -nE "error|Stack dump" release.log | head -40; tail -n 60 release.log; fi
          exit "$status"

      - name: App iOS
        run: |
          xcodebuild build -project PiloteMac.xcodeproj -scheme Pilote \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= -quiet
